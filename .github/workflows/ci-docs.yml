name: CI docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: |
            **/*.md
            !node_modules/**
            !dist/**
            !.venv/**
            !api/.venv/**
            !docs/seo/links-audit-*.md

  link-check:
    name: Link check (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lychee link check
        uses: lycheeverse/lychee-action@v2
        with:
          # CI ships lychee v0.23 which does not support --exclude-mail
          # (mail links are skipped by default anyway in this version).
          # Excludes:
          # - example.com / localhost / 127.0.0.1: reserved or local.
          # - porkbun.com/api: private auth surface, no public docs.
          # - doi.org: stable identifiers but the publishers do
          #   server-side bot detection; lychee from a CI runner
          #   sees 403 / 404 even when the DOI resolves fine in a
          #   browser. Excluded entirely; correctness of DOIs is
          #   checked by humans when adding new references.
          # - ipip.ori.org and projects.ori.org: return "Connection
          #   reset by peer" to lychee from a runner. Both are
          #   authoritative Oregon Research Institute hosts, ipip for
          #   the item pool and projects for Goldberg's paper PDFs,
          #   and both fetch fine from a developer machine. Flap
          #   suppressed here rather than the links removed.
          # Accept 403 as a valid response for everything else so a
          # bot-detected publisher does not turn the gate red, and 405
          # because lychee tries HEAD first: api.cercol.team/beta is a
          # GET-only FastAPI route, so HEAD is correctly refused and the
          # link is fine. That 405 is what first turned this job red.
          #
          # 203 is pubmed.ncbi.nlm.nih.gov, which started labelling every
          # response "Non-Authoritative Information" some time after
          # 2026-08-10, when this job was last green. It is not bot
          # detection: a browser User-Agent gets the same 203, and the
          # pages resolve. 203 is a 2xx and lychee simply does not accept
          # it by default, so it belongs in this list rather than in the
          # exclusions, which would stop checking NCBI links at all.
          #
          # docs/seo/links-audit-*.md is a GENERATED report whose whole
          # job is to list broken links found by scripts/audit_blog_links.py.
          # Link-checking it would always fail by design, so it is
          # excluded (both a glob and the literal current file, so the
          # exclusion holds whichever path-matching the pinned lychee uses).
          args: >-
            --no-progress
            --accept '200,203,206,301,302,304,403,405'
            --exclude '^https?://(?:www\.)?example\.(?:com|org|net)'
            --exclude '^https?://localhost'
            --exclude '^https?://127\.0\.0\.1'
            --exclude 'porkbun\.com/api'
            --exclude 'doi\.org'
            --exclude 'ipip\.ori\.org'
            --exclude 'projects\.ori\.org'
            --exclude 'dlc\.iec\.cat'
            --exclude 'gencat\.cat'
            --exclude-path 'docs/seo/links-audit-*.md'
            --exclude-path 'docs/seo/links-audit-20260528.md'
            './**/*.md'
          fail: true

  spec-paths:
    name: Validate Spec markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run spec validator
        run: python3 scripts/check_spec_paths.py

  glossary:
    name: Translation glossaries match the locales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The glossaries are generated from src/locales/*.json. If a locale
      # changes and the glossary does not, translators start working from a
      # term the app no longer uses, which is exactly how the German corpus
      # ended up carrying three different words for one dimension.
      - name: Check glossaries are current
        run: python3 scripts/build_glossary.py --check

  docs-coherence:
    name: Docs vs code coherence (soft)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect changed files
        id: changed
        run: |
          base=${{ github.event.pull_request.base.sha }}
          head=${{ github.event.pull_request.head.sha }}
          git diff --name-only "$base" "$head" > /tmp/changed.txt
          echo "files<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/changed.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Run coherence check
        id: check
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          python3 scripts/check_docs_coherence.py | tee /tmp/coherence.txt
          if grep -q "^docs-coherence warnings:" /tmp/coherence.txt; then
            echo "needs_label=true" >> $GITHUB_OUTPUT
          else
            echo "needs_label=false" >> $GITHUB_OUTPUT
          fi
      - name: Label PR when warnings emitted
        if: steps.check.outputs.needs_label == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-docs-review'],
            });
