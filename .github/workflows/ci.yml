name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # Use `npm install` instead of `npm ci` because package-lock.json
        # is regenerated on macOS (the primary dev platform) and lacks the
        # optional linux-x64 native binaries (@esbuild/linux-x64-gnu,
        # @rollup/rollup-linux-x64-gnu, @tailwindcss/oxide-linux-x64-gnu,
        # etc.) that `npm ci` strictly requires on this Ubuntu runner.
        # `npm install` resolves missing optional platform deps without failing.
        run: npm install

      - name: Build
        run: npm run build

      - name: Bundle sanity — brand colors present as hex strings
        # Guards against mm-design exporting objects instead of hex strings,
        # which causes style={{ backgroundColor: colors.blue }} to silently break.
        # Searches ALL JS chunks (not just index-*.js) because code splitting
        # moves design tokens into vendor chunks.
        run: |
          echo "Checking all JS chunks in dist/assets/"
          for COLOR in "0047ba" "cf3339" "f1c22f" "427c42" "ffffff" "111111"; do
            if grep -ql "$COLOR" dist/assets/*.js; then
              echo "✓ #$COLOR found"
            else
              echo "✗ #$COLOR NOT found in any bundle chunk — design token may be broken"
              exit 1
            fi
          done

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # Use `npm install` instead of `npm ci` — see Build & lint job above
        # for the full rationale (macOS lockfile / linux-x64 optional deps).
        run: npm install

      - name: Run tests
        run: npm test -- --run

  shell-lint:
    name: Shell script lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck deploy scripts
        # shellcheck ships preinstalled on ubuntu-latest.
        run: shellcheck api/deploy/backup/*.sh scripts/test_content_migration.sh

  doi-check:
    name: DOI resolution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Content-seeding migrations are the one route to production that the
    # admin-API guard in api/blog.py cannot cover. Three batches of fabricated
    # DOIs shipped before this existed (migrations 031, 033, 034): the citation
    # text always named a real paper, so only the resolver could tell.
    # Fails only on a definitive 404 from doi.org; unreachable DOIs pass.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install httpx
        run: pip install httpx

      - name: Resolve DOIs in changed migrations
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          # First push to a branch reports an all-zero base; fall back to HEAD~1.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          FILES=$(git diff --name-only --diff-filter=d "$BASE" HEAD -- 'db/migrations/*.sql')
          if [ -z "$FILES" ]; then
            echo "No migration changes; nothing to check."
            exit 0
          fi
          echo "Checking: $FILES"
          # shellcheck disable=SC2086
          python scripts/check_dois.py $FILES

      # check_dois.py only asks whether a DOI resolves. That is not enough:
      # a fabricated citation shipped in six languages with a DOI that
      # resolved perfectly, to a PLOS ONE study of health services in Nepal,
      # under the name of two authors who had written a different paper in a
      # different journal. Two sentences were attributed to it, one of them
      # quoted, both saying Cercol's approach beats its main competitor.
      #
      # check_doi_attribution.py compares the surnames in the citation text
      # against the Crossref record and would have caught it on the day. It
      # existed and nothing ran it. This is that.
      - name: Check DOI attribution against Crossref
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        if: env.DATABASE_URL != ''
        run: |
          pip install asyncpg
          python scripts/check_doi_attribution.py

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt pytest pytest-asyncio httpx

      - name: Run backend tests
        run: |
          cd api
          python -m pytest tests/ -v
        continue-on-error: false

      - name: Validate Caddy snippet
        # The snippet is imported by topquaranta's main Caddyfile via
        # `import /etc/caddy/conf.d/*.caddy`. A standalone snippet is not
        # a complete Caddyfile, so wrap it in a one-line import wrapper
        # and validate that. Fails CI on any syntax error before deploy.
        # Caddy resolves `import` paths relative to the Caddyfile's
        # directory (not the workdir), so the wrapper uses the absolute
        # path that the snippet is mounted at inside the container.
        run: |
          echo "import /work/api/deploy/caddy/cercol-api.caddy" > /tmp/wrapper.caddy
          docker run --rm \
            -v "$PWD:/work:ro" \
            -v "/tmp/wrapper.caddy:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
