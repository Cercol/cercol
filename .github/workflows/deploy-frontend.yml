name: Deploy frontend

on:
  workflow_dispatch: {}
  # The blog is prerendered at build time from api.cercol.team, so an article
  # corrected in the database does not reach a reader until something in this
  # repo happens to change. Twenty-odd content migrations landed before anyone
  # noticed that the live pages were still serving the version before them.
  # A nightly rebuild closes that on its own, and costs one build.
  schedule:
    - cron: '20 3 * * *'
  push:
    branches: [main]
    paths:
      # A content migration changes what the prerender reads from the API,
      # so it has to rebuild. Without this, a migration merged after the
      # last frontend-touching commit sits in the database and never
      # reaches a reader until the nightly run. That happened with the
      # fabricated citation in 078: removed from the database at 08:30 and
      # still on the live page half an hour later, because every commit
      # after it touched only docs and CI.
      - 'db/migrations/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.env.production'
      - 'scripts/**'        # Build scripts (prerender, sitemap) affect output

permissions:
  contents: write

# The build takes most of its 35 minute budget prerendering 648 routes, so
# two pushes a few minutes apart overlap, and both then push to gh-pages.
# The loser of that race fails on a non-fast-forward and its content never
# ships, which looks like a deploy that succeeded and did nothing.
# cancel-in-progress: false protects the run that is actually building. A
# run already queued behind it is still superseded by the next one to
# arrive, because GitHub keeps at most one pending run per group, so those
# show as "cancelled" in the run list. That is the wanted behaviour: the
# newer run is a superset, since the prerender reads the whole corpus from
# the API at build time rather than a diff. What must never be cancelled is
# a build mid-push, which is how gh-pages ends up half written.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  test:
    name: Frontend tests (deploy gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # Use `npm install` instead of `npm ci` because package-lock.json
        # is regenerated on macOS (the primary dev platform) and lacks the
        # optional linux-x64 native binaries (@rollup/rollup-linux-x64-gnu,
        # @tailwindcss/oxide-linux-x64-gnu, etc.) that `npm ci` strictly
        # requires on this Ubuntu runner (npm/cli optional-deps bug).
        # `npm install` resolves missing optional platform deps without failing.
        run: npm install

      - name: Run tests
        run: npm test -- --run

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # The prerender step (puppeteer over ~650 routes) has historically
    # taken 16 to 22 minutes; 35 leaves headroom without letting a hang
    # burn the 6-hour default.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          # gh-pages needs full history to push correctly
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # `npm install`, not `npm ci`: see the test job above.
        run: npm install

      - name: Build + prerender
        run: npm run build:full
        # VITE_API_URL is read from .env.production (committed, non-secret).
        # build:full = vite build + scripts/prerender.mjs (puppeteer-core).
        # ubuntu-latest includes Chromium; CHROME_PATH points to it.
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable

      # api/tests/test_internal_links_integrity.py reads dist/ and skips when
      # it has not been prerendered, which is every other job in this repo:
      # ci.yml runs `npm run build`, not build:full, so the guard has never
      # once executed. It was written after /first-quarter answered 404 to
      # every crawler, and it was dormant while 66 dead /blog/ links sat in
      # the corpus. This is the only place a prerendered dist/ exists, so it
      # is the only place the guard can run. Blocking on purpose: shipping a
      # known set of crawlable 404s is worse than a stale deploy.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Internal link integrity (prerendered dist)
        run: |
          pip install pytest
          python -m pytest api/tests/test_internal_links_integrity.py -v

      # cercol.team is served by the cercol-web Worker (web/wrangler.jsonc)
      # since 2026-08-17. GitHub Pages is still published as a warm fallback:
      # restoring the nine DNS records saved at
      # ~/.cercol-migration/dns-github-pages-backup.json puts it back in
      # front. Drop the gh-pages step once the Worker has served a quiet
      # fortnight; keep this one.
      - name: Deploy to Cloudflare (static assets)
        run: npx wrangler deploy --config web/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
